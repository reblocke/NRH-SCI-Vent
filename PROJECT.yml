      approved_at: "2026-07-24"
      approver_roles:
        - data steward
      secure_artifact_id: NRH003-4fe498dd-ac82-47fd-8677-5a28815a953f
    - version: 2
      approved_at: "2026-07-25"
      approver_roles:
        - scientific owner
        - data steward
      secure_artifact_id: NRH004-37fdea65-5a0b-414c-8a5b-d9356b044e61

