comparison_policy:
  exact:
    applies_to:
      - integer counts
      - category codes and labels
      - status values
      - stable SHA-256 hashes
    absolute_tolerance: 0
    relative_tolerance: 0
  numeric_tolerance:
    rule: abs(actual - expected) <= max(absolute_tolerance, relative_tolerance * abs(expected))
    default_absolute_tolerance: 1.0e-8
    default_relative_tolerance: 1.0e-6
  precision_limited:
    rule: absolute_tolerance must equal half the final recorded unit
    requires_recorded_precision: true
  informational:
    rule: record for provenance but do not use as a pass-fail release gate
    required: false

privacy:
  source_classification: restricted clinical data
  public_values_permitted: false
  private_bundle_location: institutionally approved storage outside the Git repository
  prohibited_public_artifacts:
    - patient-level data
    - aggregate expected values without disclosure approval
    - real-data logs
    - generated real-data tables or figures
    - source paths that expose user or institutional details
